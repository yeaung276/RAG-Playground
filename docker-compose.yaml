services:
   app:
      platform: linux/amd64
      build:
         context: .
         dockerfile: Dockerfile
      ports:
         - 9997:8000
      environment:
         - LOG_LEVEL=
         - AGENT_NAME=
         - WELCOME_MESSAGE=
         - WEBHOOK_ENDPOINT=
         - WEBHOOK_TOKEN=
         - STORAGE_PATH=.knowledge/storage
         - SESSION_TIMEOUT_MINUTES=30
         - TYPHOON_BASE_URL=http://typhoon:8000/v1
         - TYPHOON_OCR_API_KEY=${MODEL_API_KEY}
         - TYPHOON_OCR_MODEL=typhoon-ai/typhoon-ocr1.5-2b
         - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/chat_gateway
         - QDRANT_URL=http://qdrant:6333
         - QDRANT_API_KEY=
         - MODEL_KEK=${MODEL_KEK}
      restart: unless-stopped
      depends_on:
         db:
            condition: service_healthy
         qdrant:
            condition: service_started

   db:
      image: postgres:16
      restart: unless-stopped
      environment:
         - POSTGRES_USER=postgres
         - POSTGRES_PASSWORD=postgres
         - POSTGRES_DB=chat_gateway
      ports:
         - 5432:5432
      volumes:
         - pgdata:/var/lib/postgresql/data
      healthcheck:
         test: ["CMD-SHELL", "pg_isready -U postgres"]
         interval: 5s
         timeout: 5s
         retries: 5

   qdrant:
      image: qdrant/qdrant:v1.15.1
      restart: unless-stopped
      ports:
         - 6333:6333
         - 6334:6334
      volumes:
         - qdrantdata:/qdrant/storage

   typhoon:
      image: vllm/vllm-openai:v0.19.1
      container_name: typhoon-ocr-2b
      restart: unless-stopped
      environment:
         - NVIDIA_DRIVER_CAPABILITIES=compute,utility
         - VLLM_RPC_TIMEOUT=300
      ports:
         - "8388:8000"
      deploy:
         resources:
            reservations:
               devices:
                  - driver: nvidia
                    device_ids: ["0"]
                    capabilities: [gpu]
      volumes:
         - ./models:/root/.cache/huggingface
      command:
         - --model=typhoon-ai/typhoon-ocr1.5-2b
         - --max-model-len=49152
         - --gpu-memory-utilization=0.9
         - --api-key=${MODEL_API_KEY}
         - --dtype=float16

volumes:
   pgdata:
   qdrantdata:
