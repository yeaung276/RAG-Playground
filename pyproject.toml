[project]
name = "chat-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]~=0.135.0",
    "aiohttp~=3.13.5",
    "pillow>=12.2.0",
    "prometheus-fastapi-instrumentator>=8.0.2",
    "sqlalchemy[asyncio]~=2.0.0",
    "asyncpg~=0.30.0",
    "pydantic-settings>=2.14.1",
    "aiofiles>=25.1.0",
    "python-multipart>=0.0.32",
    "nanoid>=2.0.0",
    "pypdfium2>=5.11.0",
    "langchain-core>=1.4.9",
    "langchain-text-splitters>=1.1.2",
    "bs4>=0.0.2",
    "tenacity>=9.1.4",
    "itsdangerous>=2.2.0",
    "pwdlib[bcrypt]>=0.3.0",
    "langchain-experimental>=0.4.2",
    "qdrant-client>=1.18.0",
    "pythainlp>=5.3.4",
    "python-crfsuite>=0.9.12",
    "aiolimiter>=1.2.1",
    "llama-index>=0.14.23",
    "llama-index-core>=0.14.23",
    "neo4j>=5.28.4",
    "llama-index-graph-stores-neo4j>=0.7.0",
    "llama-index-embeddings-huggingface>=0.7.0",
    "einops>=0.8.2",
    "llama-index-llms-ollama>=0.10.1",
    "langchain-openai>=1.6.0",
    "cryptography>=50.0.1",
    "langchain>=1.4.0",
    "langgraph>=1.2.11",
    "langchain-google-genai>=4.4.0",
    "langchain-cohere>=0.6.0",
    "langchain-huggingface>=1.2.2",
    "langgraph-checkpoint-postgres>=3.1.2",
]

[dependency-groups]
dev = [
    "guidellm>=0.6.1",
    "httpx>=0.28.1",
    "numpy>=1.24",
    "matplotlib>=3.9",
    "tqdm>=4.68.3",
    "alembic~=1.14.0",
    "python-dotenv>=1.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "aiosqlite>=0.22.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
default-groups = ["dev"]
override-dependencies = [
    "uvloop ; sys_platform != 'win32'",
]
